<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="갓생">
<meta name="theme-color" content="#ffffff">
<title>갓생</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; }
  #app { position: fixed; inset: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; display: flex; flex-direction: column; }
  #views { flex: 1; position: relative; overflow: hidden; }
  #views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; background: #f5f6f8; }
  #views iframe.on { visibility: visible; }
  #views .load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa0aa; font-size: 14px; font-family: Pretendard, -apple-system, sans-serif; }
  #toast { display: none; position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d1f23; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 9; font-family: Pretendard, -apple-system, sans-serif; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { #views iframe { background: #121316; } }
  .screen { max-width: 420px; margin: 0 auto; padding: 48px 20px; line-height: 1.6; color: #222; }
  .screen h1 { font-size: 24px; margin: 0 0 8px; }
  .screen p { color: #555; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin: 12px 0; }
  button { font-size: 16px; padding: 12px 18px; border: 0; border-radius: 10px; background: #1c7ed6; color: #fff; font-weight: 600; }
  #bar { display: none; align-items: center; gap: 10px; padding: 8px 12px; background: #e7f5ff; font-size: 14px; color: #1864ab; }
  #bar button { padding: 6px 12px; font-size: 14px; }
  #bar .x { background: transparent; color: #1864ab; padding: 6px; margin-left: auto; }
  #msg { font-size: 14px; color: #1864ab; }
  #tabs { display: flex; border-top: 1px solid #e3e5ea; background: rgba(255,255,255,.96); padding: 6px 0 calc(4px + env(safe-area-inset-bottom)); }
  #tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; color: #9aa0aa; border-radius: 0; padding: 4px 0; font-size: 11px; font-weight: 600; letter-spacing: -.01em; font-family: Pretendard, -apple-system, sans-serif; }
  #tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tabs button .ic { display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px; transition: background .15s; }
  #tabs button.on { color: #3b5bdb; }
  #tabs button.on .ic { background: #edf2ff; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #121316; }
    #tabs { background: rgba(27,29,34,.96); border-top-color: #2f323a; }
    #tabs button { color: #6b7280; }
    #tabs button.on { color: #91a7ff; }
    #tabs button.on .ic { background: #232a45; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// Firebase는 알림 등록할 때만 불러옴 (첫 화면 속도)
const fb = () => Promise.all([
  import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js'),
]).then(([a, m]) => ({ initializeApp: a.initializeApp, getMessaging: m.getMessaging, getToken: m.getToken, isSupported: m.isSupported }));

const GAS = 'https://script.google.com/macros/s/AKfycbymqLQTpP66A9kWfl-tIuFqMOBeZBxC9YR6Y7TQFwvY_-IIHJMrySbmRb8xN_2T-EkC/exec';
const VAPID = 'BMXmuSbI5YiHcma0p3rn2Y1uMVYcupjPktAnVttgrkzH5KCTbZJJ1bo_pSfvjFFXOPq6vg9wkm7ZllOHT_Uwo1I';
const firebaseConfig = {
  apiKey: 'AIzaSyD34Z7lyAvZhb5J5lo9nfeV2YwpMyGRLOo',
  authDomain: 'godsaeng-233c4.firebaseapp.com',
  projectId: 'godsaeng-233c4',
  storageBucket: 'godsaeng-233c4.firebasestorage.app',
  messagingSenderId: '1097517603627',
  appId: '1:1097517603627:web:dfe2239b8213937147c36e',
};

const $app = document.getElementById('app');
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let key = localStorage.getItem('gk') || '';

async function api(params) {
  const q = new URLSearchParams({ ...params, k: key });
  const r = await fetch(GAS + '?' + q.toString());
  return r.json();
}

function showSetup(err) {
  $app.innerHTML = `
    <div class="screen">
      <h1>갓생 ✅</h1>
      <p>처음 한 번만 <b>연결 코드</b>를 넣어주세요.</p>
      <input id="key" placeholder="연결 코드 붙여넣기" autocomplete="off" autocapitalize="off">
      <button id="go">연결</button>
      <p id="msg">${err || ''}</p>
    </div>`;
  document.getElementById('go').onclick = async () => {
    key = document.getElementById('key').value.trim();
    document.getElementById('msg').textContent = '확인 중…';
    try {
      const r = await api({ api: 'ping' });
      if (!r.ok) throw new Error();
      localStorage.setItem('gk', key);
      showMain();
    } catch (_) {
      document.getElementById('msg').textContent = '코드가 맞지 않아요. 다시 확인해주세요.';
    }
  };
}

function showInstallHelp() {
  $app.innerHTML = `
    <div class="screen">
      <h1>갓생 ✅</h1>
      <p>알림을 받으려면 홈 화면에 앱을 추가해야 해요.</p>
      <ol>
        <li>아래쪽 <b>공유 버튼</b>(네모에 위 화살표)을 누르고</li>
        <li><b>홈 화면에 추가</b>를 누른 다음</li>
        <li>홈 화면에 생긴 <b>갓생</b> 아이콘으로 열어주세요.</li>
      </ol>
    </div>`;
}

async function registerPush(silent) {
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const { initializeApp, getMessaging, getToken } = await fb();
  const messaging = getMessaging(initializeApp(firebaseConfig));
  const token = await getToken(messaging, { vapidKey: VAPID, serviceWorkerRegistration: reg });
  if (!token) throw new Error('토큰을 받지 못했어요');
  if (!silent || localStorage.getItem('ft') !== token) {
    const r = await api({ api: 'register', token, ua: navigator.userAgent });
    if (!r.ok) throw new Error(r.error || '등록 실패');
    localStorage.setItem('ft', token);
  }
}

async function showMain() {
  $app.innerHTML = `
    <div id="bar"><span>🔔 알림을 켜면 브리핑과 일정 알림이 와요</span><button id="on">알림 켜기</button><button class="x" id="x">✕</button></div>
    <div id="views"></div><div id="toast"></div>
    <div id="tabs"><button data-p="kanban"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg></span>칸반</button><button data-p="brief"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h10A1.5 1.5 0 0 1 17 5.5V18a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h2.5A1.5 1.5 0 0 1 21 10.5V18a2 2 0 0 1-2 2"/><path d="M8 8h5"/><path d="M8 12h5"/><path d="M8 16h3"/></svg></span>브리핑</button><button data-p="lang"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h8"/><path d="M8 3v2"/><path d="M10.5 5c-.6 3.6-2.8 6.4-6 8"/><path d="M5.5 8.5c1.2 2 3 3.5 5.5 4.5"/><path d="M12.5 21l4-9 4 9"/><path d="M14 18h5"/></svg></span>외국어</button><button data-p="support"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><rect x="3" y="7" width="18" height="5" rx="1"/><path d="M12 7v14"/><path d="M12 7c-1.5-3-5-3.5-5-1.2C7 7 9.5 7 12 7z"/><path d="M12 7c1.5-3 5-3.5 5-1.2C17 7 14.5 7 12 7z"/></svg></span>지원</button></div>`;
  /* 화면 4개를 각각 띄워두고 숨겼다 보여주기만 함. 화면 HTML은 폰에 저장해 두고 바로 보여준 뒤, 뒤에서 최신으로 교체 */
  const VIEWS = ['kanban', 'brief', 'lang', 'support'];
  const $views = document.getElementById('views'), $toast = document.getElementById('toast');
  const frames = {}, touched = {}, loading = {};
  let cur = '';
  const SHIM = '<script>(function(){var P=window.parent;function mk(s,f){var h={withSuccessHandler:function(x){return mk(x,f)},withFailureHandler:function(x){return mk(s,x)},withUserObject:function(){return h}};' +
    'return new Proxy(h,{get:function(t,n){if(n in t)return t[n];return function(){var a=[].slice.call(arguments);P.__rpc(n,a).then(function(r){s&&s(r)},function(e){if(f)f(e);else console.error(e)})}}})}' +
    'window.google={script:{run:mk(),host:{close:function(){},setHeight:function(){},setWidth:function(){}}}};})();<\/script>';
  // 읽기만 하는 기능은 GET(한 단계 짧음), 저장·수정은 POST
  const READ = ['getBoard'];
  window.__rpc = async (fn, args) => {
    const r = READ.indexOf(fn) >= 0
      ? await fetch(GAS + '?' + new URLSearchParams({ api: 'rpc', fn, a: JSON.stringify(args || []), k: key }))
      : await fetch(GAS, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: key, fn, args }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '실패');
    return j.data;
  };
  const toast = (t, ms) => { $toast.textContent = t; $toast.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { $toast.style.display = 'none'; }, ms || 2500); };
  const inject = html => /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + SHIM) : SHIM + html;
  const mount = (p, html) => {
    let f = frames[p];
    if (!f) { f = frames[p] = document.createElement('iframe'); f.setAttribute('allow', 'clipboard-write'); $views.appendChild(f); }
    touched[p] = false;
    f.onload = () => { try { f.contentWindow.addEventListener('pointerdown', () => { touched[p] = true; }, true); } catch (_) {} };
    f.srcdoc = inject(html);
    f.classList.toggle('on', p === cur);
    const ld = document.getElementById('ld-' + p); if (ld) ld.remove();
  };
  const fetchPage = async (p, force) => {
    if (loading[p]) return loading[p];
    loading[p] = (async () => {
      try {
        const r = await api({ api: 'page', name: p });
        if (!r.ok) throw new Error(r.error || '불러오기 실패');
        const old = localStorage.getItem('pg:' + p);
        try { localStorage.setItem('pg:' + p, r.html); } catch (_) {}
        if (!frames[p]) mount(p, r.html);
        else if (r.html !== old || force) {
          if (!touched[p] || p !== cur || force) mount(p, r.html);
          else toast('새 내용이 있어요 · 탭을 한 번 더 누르면 새로고침', 3500);
        }
      } catch (e) {
        if (!frames[p] && p === cur) { const ld = document.getElementById('ld-' + p); if (ld) ld.textContent = '불러오지 못했어요 · 탭을 다시 눌러주세요'; }
      } finally { loading[p] = null; }
    })();
    return loading[p];
  };
  const open = p => {
    p = VIEWS.indexOf(p) >= 0 ? p : 'kanban';
    if (p === cur && frames[p]) { toast('새로고침 중…', 1200); fetchPage(p, true); return; } // 같은 탭 다시 누르면 새로고침
    cur = p;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
    Object.keys(frames).forEach(k => frames[k].classList.toggle('on', k === p));
    if (!frames[p]) {
      const cached = localStorage.getItem('pg:' + p);
      if (cached) mount(p, cached);
      else if (!document.getElementById('ld-' + p)) { const d = document.createElement('div'); d.className = 'load'; d.id = 'ld-' + p; d.textContent = '불러오는 중…'; $views.appendChild(d); }
      fetchPage(p);
    }
    VIEWS.forEach(v => { const ld = document.getElementById('ld-' + v); if (ld) ld.style.display = v === p ? 'flex' : 'none'; });
  };
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => open(b.dataset.p));
  // 첫 화면 뒤에 나머지 탭도 미리 불러둠 (캐시가 있으면 바로 화면에 올려둠)
  setTimeout(() => VIEWS.forEach((v, i) => setTimeout(() => {
    if (!frames[v]) { const c = localStorage.getItem('pg:' + v); if (c) mount(v, c); }
    if (v !== cur) fetchPage(v);
  }, 400 * i)), 1500);
  // 앱으로 돌아왔을 때 오래됐으면 뒤에서 갱신
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000) VIEWS.forEach(v => { if (frames[v]) fetchPage(v); });
  });
  open(new URLSearchParams(location.search).get('p'));
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.open) open(e.data.open); });
  const bar = document.getElementById('bar');
  if (isIOS && !standalone && !localStorage.getItem('installHidden')) {
    bar.style.display = 'flex';
    bar.querySelector('span').textContent = '📲 공유 → 홈 화면에 추가하면 알림도 받을 수 있어요';
    document.getElementById('on').style.display = 'none';
    document.getElementById('x').onclick = () => { bar.style.display = 'none'; localStorage.setItem('installHidden', '1'); };
    return;
  }
  const supported = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  if (!supported) return;
  if (Notification.permission === 'granted') {
    registerPush(true).catch(e => console.warn(e));
  } else if (Notification.permission === 'default' && !localStorage.getItem('barHidden')) {
    bar.style.display = 'flex';
  }
  document.getElementById('x').onclick = () => { bar.style.display = 'none'; localStorage.setItem('barHidden', '1'); };
  document.getElementById('on').onclick = async () => {
    const span = bar.querySelector('span');
    try {
      const p = await Notification.requestPermission();
      if (p !== 'granted') { span.textContent = '알림이 허용되지 않았어요 (설정 → 알림에서 바꿀 수 있어요)'; return; }
      span.textContent = '연결 중…';
      await registerPush(false);
      span.textContent = '✅ 알림 연결 완료! 곧 확인 알림이 와요';
      setTimeout(() => { bar.style.display = 'none'; }, 4000);
    } catch (e) {
      span.textContent = '연결 실패: ' + (e.message || e);
    }
  };
}

(async () => {
  if (!key) return showSetup();
  showMain();
  // 연결 코드 확인은 뒤에서 (틀렸을 때만 다시 입력 화면)
  api({ api: 'ping' }).then(r => { if (r && r.ok === false) { localStorage.removeItem('gk'); key = ''; showSetup('연결 코드를 다시 넣어주세요.'); } }).catch(() => {});
  return;
  showMain();
})();
</script>
</body>
</html>
